
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
     {
		upstream golang_backend {
		server 127.0.0.1:8081;
		server 127.0.0.1:8082;
		server 127.0.0.1:8
	}

    server {
        {
			listen 8080;
			server_name localh

					location / {
			proxy_pass http://golang_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
	}
}


for ($i=1; $i -le 100; $i++) {
Invoke-WebRequest -Uri "http://localhost:8081/user" -Method Get
Invoke-WebRequest -Uri "http://localhost:8082/user" -Method Get
Invoke-WebRequest -Uri "http://localhost:8083/user" -Method Get
}